; XIAO ESP32S3 Sense tool camera: sends one JPEG over USB on request.
; Build/upload (on the lab PC set PLATFORMIO_CORE_DIR=C:/Users/neliubov/pio,
; otherwise the Windows command line gets too long):
;   pio run -t upload --upload-port COM5
[env:xiao_esp32s3]
platform = espressif32@6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
